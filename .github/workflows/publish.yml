name: Publish

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Verify the current main handoff, or publish it
        type: choice
        options: [plan, publish]
        default: plan
        required: true

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: claudiuschuster-production
  cancel-in-progress: false

jobs:
  static:
    if: >-
      github.server_url == 'https://github.com' &&
      github.repository == 'ClaudiuSchuster/claudiuschuster.de' &&
      github.repository_id == '1351331457' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected &&
      github.sha == github.workflow_sha &&
      (github.event_name == 'workflow_dispatch' ||
       (vars.PROFILE_PUBLISH_ENABLED == 'true' &&
        github.event.workflow_run.name == 'Verify' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_sha == github.sha &&
        github.event.workflow_run.head_repository.id == 1351331457))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-static
    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'publish' }}
      GH_TOKEN: ${{ github.token }}
      CF_RELEASE_TOKEN: ${{ secrets.CF_RELEASE_TOKEN }}
      PROFILE_ORIGIN_IP: ${{ secrets.PROFILE_ORIGIN_IP }}
      PROFILE_SSH_USER: ${{ secrets.PROFILE_SSH_USER }}
      PROFILE_SSH_PORT: ${{ vars.PROFILE_SSH_PORT }}
      PROFILE_SSH_HOST_KEY: ${{ vars.PROFILE_SSH_HOST_KEY }}
      PROFILE_SSH_KEY: ${{ secrets.PROFILE_SSH_KEY }}
      PROFILE_RUNTIME_SHA256: ${{ vars.PROFILE_RUNTIME_SHA256 }}
    steps:
      - name: Check out the exact protected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Rebuild the production bundle
        run: make build

      - name: Validate checks for a manual release
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/check-release.py --sha "$RELEASE_SHA" --wait-seconds 600

      - name: Run the selected publication mode
        run: |
          set -euo pipefail
          python3 scripts/profile-publish.py \
            --mode "$RELEASE_MODE" \
            --commit "$RELEASE_SHA" \
            | tee "$RUNNER_TEMP/profile-publication-report.json"

      - name: Add the sanitized result to the job summary
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/profile-publication-report.json" ]; then
            {
              echo "## [claudiuschuster.de](https://claudiuschuster.de/) publication"
              echo
              echo "Publication result:"
              echo
              python3 - "$RUNNER_TEMP/profile-publication-report.json" <<'PY'
          import json
          import os
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  report = json.load(handle)
          except (OSError, ValueError):
              print("| Report | Could not parse the sanitized JSON report |")
              print("| --- | --- |")
          else:
              def value(name, fallback="unknown"):
                  item = report.get(name, fallback)
                  if isinstance(item, bool):
                      return str(item).lower()
                  return str(item)

              commit_sha = value("commit")
              if len(commit_sha) == 40 and all(char in "0123456789abcdef" for char in commit_sha):
                  commit = (
                      f"[{commit_sha[:7]}]("
                      f"{os.environ.get('GITHUB_SERVER_URL', 'https://github.com').rstrip('/')}/"
                      f"{os.environ['GITHUB_REPOSITORY']}/commit/{commit_sha})"
                  )
              else:
                  commit = f"`{commit_sha}`"

              print("| Mode | Verified | Commit | Target | Remote phase |")
              print("| --- | --- | --- | --- | --- |")
              print(
                  f"| `{value('mode')}` | `{value('publication_verified')}` | "
                  f"{commit} | `{value('target')}` | "
                  f"`{value('remote_phase', 'n/a')}` |"
              )
          PY
              echo
              echo "Sanitized JSON report:"
              echo
              echo '```json'
              cat "$RUNNER_TEMP/profile-publication-report.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
