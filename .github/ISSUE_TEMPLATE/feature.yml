name: Improvement proposal
description: Suggest a focused improvement to the website, build or contributor experience.
title: "enhancement: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. Larger design or architecture changes are often best explored in a Discussion first.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the user, contributor or operational need before proposing an implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: Describe the smallest useful change and any alternatives considered.
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      description: Confirm that the proposal respects the repository's defining qualities.
      options:
        - label: The proposal can remain dependency-free and tracking-free.
          required: true
        - label: The proposal can preserve progressive enhancement and accessibility.
          required: true
        - label: I have considered both languages and both design worlds where relevant.
          required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
