name: Bug report
description: Report a reproducible problem with the website or its build.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve claudiuschuster.de. Please do not report security vulnerabilities here; use the private process in SECURITY.md.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
      placeholder: A clear, concise description of the observed and expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How can it be reproduced?
      description: Include the page, design world, language and smallest reliable sequence of steps.
      placeholder: |
        1. Open ...
        2. Switch to ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include browser, operating system, viewport size and relevant accessibility settings.
      placeholder: Firefox 143, Linux, 1440×900, reduced motion enabled
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add screenshots, console output or other context. Remove private information first.

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
